spring.application.name=Session11
# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_session11
spring.datasource.username=postgres
spring.datasource.password=23092007
spring.datasource.driver-class-name=org.postgresql.Driver
# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Cấu hình log
logging.file.name=loggings/logging.log
logging.file.path=loggings
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p
# thông số giới hạn dung lượng của 1 file
logging.logback.rollingpolicy.max-file-size=50MB
# giới hạn file tồn tại trong bao lâu
logging.logback.rollingpolicy.max-history=30
# 1. Log của toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO
# 2. Log của Hibernate/JPA ở mức DEBUG 
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# 3. Log của package ở mức TRACE
logging.level.com.medical.service=TRACE
logging.level.org.example.session11=TRACE